<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Retro Snake</title>
<style>
  :root { --d: #0f380f; --m: #306230; --l: #8bac0f; --p: #9bbc0f; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: var(--d); color: var(--p);
    font-family: "Courier New", monospace; font-weight: bold;
    touch-action: none; user-select: none;
  }
  h1 { margin: 0; font-size: 2rem; letter-spacing: 0.3em; }
  #hud { display: flex; gap: 2rem; font-size: 1.1rem; }
  canvas {
    width: min(90vw, 70vh, 480px); aspect-ratio: 1;
    image-rendering: pixelated; background: var(--p);
    border: 8px solid var(--m); border-radius: 8px;
    box-shadow: 0 0 0 4px #000 inset;
  }
  canvas.shake { animation: shake 0.3s; }
  @keyframes shake {
    25% { transform: translate(-6px, 3px); } 50% { transform: translate(6px, -3px); }
    75% { transform: translate(-3px, -3px); }
  }
  p { margin: 0; font-size: 0.85rem; opacity: 0.8; text-align: center; padding: 0 1rem; }
  @media (prefers-reduced-motion: reduce) { canvas.shake { animation: none; } }
</style>
</head>
<body>
  <h1>SNAKE</h1>
  <div id="hud"><span id="score">SCORE 00</span><span id="best">BEST 00</span></div>
  <canvas id="game" width="320" height="320" tabindex="0" aria-label="Snake game"></canvas>
  <p>Arrows, WASD or swipe to steer. Space or tap to start.</p>

<script>
const cv = document.getElementById("game"), ctx = cv.getContext("2d");
const N = 20, S = 16;                       // 20x20 grid, 16px cells
const PALETTES = [
  { d: "#0f380f", m: "#306230", l: "#8bac0f", p: "#9bbc0f" }, // green
  { d: "#3a0d0c", m: "#7a2726", l: "#c9503f", p: "#f2c297" }, // red
  { d: "#0d1b2a", m: "#274c77", l: "#6096ba", p: "#cde6f5" }, // blue
];
let C = { ...PALETTES[0] };
let paletteIndex = PALETTES.length - 1; // so first reset() lands on green
function applyPalette(i) {
  C = { ...PALETTES[i] };
  const root = document.documentElement.style;
  root.setProperty("--d", C.d); root.setProperty("--m", C.m);
  root.setProperty("--l", C.l); root.setProperty("--p", C.p);
}
let snake, dir, nextDir, food, score, delay, state = "start", timer, tick = 0, best = 0;
try { best = +localStorage.getItem("snakeBest") || 0; } catch (e) {}

// Tiny square-wave beeps, like an old handheld
let audio;
function beep(freq, dur = 0.08) {
  try {
    audio = audio || new AudioContext();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = "square"; o.frequency.value = freq; g.gain.value = 0.05;
    o.connect(g); g.connect(audio.destination);
    o.start(); o.stop(audio.currentTime + dur);
  } catch (e) {}
}

function reset() {
  let next;
  do { next = Math.floor(Math.random() * PALETTES.length); }
  while (next === paletteIndex);
  paletteIndex = next;
  applyPalette(paletteIndex);
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = nextDir = { x: 1, y: 0 };
  score = 0; delay = 160;
  placeFood(); updateHud();
}
function placeFood() {
  do { food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; }
  while (snake.some(s => s.x === food.x && s.y === food.y));
}
function updateHud() {
  document.getElementById("score").textContent = "SCORE " + String(score).padStart(2, "0");
  document.getElementById("best").textContent = "BEST " + String(best).padStart(2, "0");
}

function step() {
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  const hitWall = head.x < 0 || head.y < 0 || head.x >= N || head.y >= N;
  if (hitWall || snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++; beep(880); delay = Math.max(60, delay - 4); placeFood();
    if (score > best) { best = score; try { localStorage.setItem("snakeBest", best); } catch (e) {} }
    updateHud();
  } else snake.pop();
  draw();
  timer = setTimeout(step, delay);
}

function gameOver() {
  state = "over"; beep(110, 0.4);
  cv.classList.remove("shake"); void cv.offsetWidth; cv.classList.add("shake");
  draw();
}
function start() {
  if (state === "playing") return;
  clearTimeout(timer); reset(); state = "playing"; step();
}

function text(str, y, size) {
  ctx.fillStyle = C.d; ctx.font = `bold ${size}px "Courier New", monospace`;
  ctx.textAlign = "center"; ctx.fillText(str, N * S / 2, y);
}
function draw() {
  tick++;
  ctx.fillStyle = C.p; ctx.fillRect(0, 0, N * S, N * S);
  // faint checkerboard for that LCD feel
  ctx.fillStyle = "rgba(139,172,15,0.35)";
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) if ((i + j) % 2) ctx.fillRect(i * S, j * S, S, S);
  if (!snake) return;
  // food: little apple that blinks between two shapes
  ctx.fillStyle = C.d;
  ctx.fillRect(food.x * S + 4, food.y * S + 4, 8, 8);
  ctx.fillRect(food.x * S + 7, food.y * S + (tick % 2 ? 1 : 2), 2, 3);
  // snake: dark body, darkest head with eyes
  snake.forEach((s, i) => {
    ctx.fillStyle = i ? C.m : C.d;
    ctx.fillRect(s.x * S + 1, s.y * S + 1, S - 2, S - 2);
  });
  const h = snake[0]; ctx.fillStyle = C.p;
  ctx.fillRect(h.x * S + 4, h.y * S + 4, 3, 3); ctx.fillRect(h.x * S + 9, h.y * S + 4, 3, 3);
  if (state === "start") { text("PRESS SPACE", 150, 22); text("TO PLAY", 176, 22); }
  if (state === "over") { text("GAME OVER", 145, 26); text("SCORE " + score, 175, 18); text("SPACE TO RETRY", 205, 14); }
}

function steer(x, y) {
  if (state !== "playing") return;
  if (x === -dir.x && y === -dir.y) return;     // no instant U-turns
  nextDir = { x, y }; beep(300, 0.02);
}
const keys = { ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1],
               ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0] };
addEventListener("keydown", e => {
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); start(); }
  const k = keys[e.key] || keys[e.key.toLowerCase()];
  if (k) { e.preventDefault(); steer(...k); }
});

// Touch: tap to start, swipe to steer
let t0;
cv.addEventListener("touchstart", e => { t0 = e.touches[0]; if (state !== "playing") start(); });
cv.addEventListener("touchmove", e => {
  if (!t0) return;
  const dx = e.touches[0].clientX - t0.clientX, dy = e.touches[0].clientY - t0.clientY;
  if (Math.hypot(dx, dy) < 24) return;
  Math.abs(dx) > Math.abs(dy) ? steer(Math.sign(dx), 0) : steer(0, Math.sign(dy));
  t0 = e.touches[0];
});
cv.addEventListener("click", () => { if (state !== "playing") start(); });

reset(); draw(); updateHud();
setInterval(() => { if (state !== "playing") draw(); }, 400);  // keeps the apple blinking on menus
</script>
</body>
</html>
